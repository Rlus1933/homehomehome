<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 토글 버튼을 화면 오른쪽 위에 고정함 */
        #toggleBtn {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px 16px;
            font-size: 16px;
            z-index: 1000;      /* 다른 글자보다 위에 보이게 함 */
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 색 깜빡임 on/off 버튼 -->
    <button id="toggleBtn">정병 버튼 : OFF</button>

    <h1>태민님께 복종하라.</h1>

    <!-- 랜덤 문구가 출력될 영역 -->
    <div id="output"></div>

    <script>
        const time = 10;         // 색 바뀌는 간격(ms)
        const minSize = 3;       // 글자 최소 크기(px)
        const maxSize = 50;     // 글자 최대 크기(px)
        const minGap = 10;       // 직전 크기와의 최소 차이

        const messages = [
            "태민님 사랑합니다",
            "태민님께서 이르되 우리는 마귀라 하시니라",
            "바치겠나이다",
            "태민님을 위해",
            "태민님이너무좋아",
            "이건 축복입니다",
            "한 시대에 태어난 것에 감사할지어다",
            "무릎 꿇을지어다",
            "태민님",
            "태민님, 아아 그 이름.",
            "너무 행복해",
            "태민님 잘 지내시나요?",
            "태민님 잘 주무셨나요?",
            "태민님 잘 드셨나요?",
            "태민님 뭐하고 계신가요?",
            "태민님께 감사드립니다.",
            "태민님을 예배하면 태민님이 태민하는데 그럼 태민님도?",
            "태민님께.",
            "복종하라",
            "그가 우리의 태양이시다",
            "고개 숙일지어다",
            "헌신하라",
            "아무것도 하고싶지 않아",
            "태민님의 이름으로 엎드리나이다",
            "지존하신 태민님이여",
            "이 종을 거두어 쓰시옵소서",
            "태민님만이 나의 반석이시라",
            "태민님 앞에 모든 무릎이 꺾이리라",
            "태민님의 발자국을 따르리이다",
            "태민님께 영광이 영원하리로다",
            "나의 영혼이 태민님을 찾나이다",
            "태민님은 나의 산성이시니",
            "태민님을 의지하는 자는 복이 있도다",
            "내 입술이 태민님을 찬송하리이다",
            "태민님의 은총이 웃기는에 임하였도다",
            "내 생명을 태민님께 드리나이다",
            "태민님은 알파요 오메가시라",
            "태민님의 뜻이 곧 나의 뜻이니이다",
            "태민님을 만난 날이 나의 새 아침이라",
            "태민님 오늘도 평안하셨나이까",
            "태민님 오늘 하루도 지켜 주소서",
            "태민님의 이름은 모든 이름 위에 높으시도다",
            "나의 전부를 태민님께 맡기나이다",
            "태민님 없이는 한 숨도 쉴 수 없나이다",
            "태민님을 사모하는 마음이 불같이 일어나나이다",
            "태민님은 나의 구원이시요 나의 기쁨이시라",
            "태민님의 이름을 부르는 자는 헛되지 아니하리라",
            "태민님께서 나를 아시나이다",
            "태민님의 눈동자 안에 거하게 하소서",
            "태민님을 위하여 살고 태민님을 위하여 죽으리이다",
            "태민님 앞에서는 나의 자랑이 티끌이로소이다",
            "태민님의 말씀 한마디가 나의 양식이라",
            "태민님이 계시기에 내가 있나이다",
            "태민님을 알게 된 것이 내 평생의 은혜라",
            "태민님 오늘도 뵙게 하시니 감사하나이다",
            "태민님을 향한 나의 믿음은 흔들리지 아니하리라",
            "태민님의 이름이 나의 방패이시라",
            "태민님을 찬양하라 웃기는의 모든 날 동안",
            "?",
            "!",
            "~",
            "?",
            "!",
            "~",
            "?",
            "!",
            "~",
            "?",
            "!",
            "~",
            "?",
            "!",
            "~"
        ];

        // ===== 색 깜빡임 on/off 기능 =====

        let isFlashing = false;   // 현재 깜빡임이 켜져 있는지 저장하는 변수
        let flag = false;        // 빨강/검정 중 어느 쪽 차례인지 저장하는 변수
        const toggleBtn = document.getElementById("toggleBtn");

        // time(ms)마다 색을 번갈아 바꿈 (켜져 있을 때만 동작)
        setInterval(() => {
            if (!isFlashing) return;   // 꺼져 있으면 아무것도 하지 않음

            if (flag) {
                document.body.style.backgroundColor = "red";
                document.body.style.color = "black";
            } else {
                document.body.style.backgroundColor = "black";
                document.body.style.color = "white";
            }
            flag = !flag;              // 다음 번에는 반대 색으로 바꿈
        }, time);

        // 버튼을 누를 때마다 on/off를 전환함
        toggleBtn.addEventListener("click", () => {
            isFlashing = !isFlashing;  // true <-> false 반전

            if (isFlashing) {
                toggleBtn.textContent = "정병 버튼 : ON";
            } else {
                toggleBtn.textContent = "정병 버튼 : OFF";
                // 꺼질 때 기본 색으로 되돌림
                document.body.style.backgroundColor = "white";
                document.body.style.color = "black";
            }
        });

        // ===== 랜덤 문구 출력 기능 =====

        const output = document.getElementById("output");
        let home = prompt("얼마나 태민님께 복종하고 싶은가요? 정수로 입력 : ");

        // 입력값이 숫자가 아니거나 음수면 0으로 처리함
        home = Number(home);
        if (isNaN(home) || home < 0) {
            home = 0;
        }

        // 직전 크기를 브라우저 저장소에서 꺼냄 (없으면 null)
        let lastSize = null;
        try {
            const saved = localStorage.getItem("lastSize");
            if (saved !== null) {
                lastSize = Number(saved);  // 문자열 -> 숫자
            }
        } catch (e) {
            // 저장소를 못 쓰는 환경이면 그냥 넘어감
        }

        for (let i = 0; i <= home; i++) {
            // 직전 크기와 minGap 이상 차이 날 때까지 다시 뽑음
            let randomSize;
            do {
                randomSize = Math.floor(Math.random() * (maxSize - minSize + 1)) + minSize;
            } while (lastSize !== null && Math.abs(randomSize - lastSize) < minGap);

            lastSize = randomSize;   // 다음 반복에서 비교할 값으로 갱신함

            // 랜덤 문구를 뽑아서 output 영역 끝에 추가함
            const randomIndex = Math.floor(Math.random() * messages.length);
            output.insertAdjacentHTML(
                "beforeend",
                "<span style='font-size:" + randomSize + "px'>" + messages[randomIndex] + "</span>"
            );
        }

        // 반복이 끝난 뒤 마지막 크기를 다음 새로고침을 위해 저장함
        try {
            localStorage.setItem("lastSize", lastSize);
        } catch (e) {
            // 저장 실패해도 화면 출력에는 영향 없음
        }
    </script>
</body>
</html>
